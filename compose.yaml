# Local full stack: PostgreSQL, S3-compatible storage (MinIO), API and website.
#   cp .env.example .env.docker   # fill the secrets
#   docker compose --env-file .env.docker up -d --build
#   docker compose run --rm migrate          # apply migrations
#   docker compose run --rm migrate npm run db:seed
# Not for production as-is: use managed PostgreSQL/object storage there.
name: dvg

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dvg
      POSTGRES_USER: dvg
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: [db-data:/var/lib/postgresql/data]
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dvg -d dvg"]
      interval: 5s
      retries: 10

  storage:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY}
    volumes: [storage-data:/data]
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]

  storage-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on: [storage]
    entrypoint: >
      /bin/sh -c "until mc alias set local http://storage:9000 $${S3_ACCESS_KEY_ID} $${S3_SECRET_ACCESS_KEY}; do sleep 1; done;
      mc mb --ignore-existing local/dvg-media && mc anonymous set download local/dvg-media"
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}

  migrate:
    build: { context: ., target: migrate }
    profiles: [tools]
    depends_on: { db: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgresql://dvg:${POSTGRES_PASSWORD}@db:5432/dvg?schema=public

  api:
    build: { context: ., target: runtime }
    depends_on: { db: { condition: service_healthy }, storage-init: { condition: service_completed_successfully } }
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://dvg:${POSTGRES_PASSWORD}@db:5432/dvg?schema=public
      APP_ORIGINS: https://localhost
      SITE_URL: http://localhost:3000
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET}
      # Local compose runs over plain HTTP behind no proxy; production must use HTTPS.
      COOKIE_SECURE: "true"
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://storage:9000
      S3_FORCE_PATH_STYLE: "true"
      S3_BUCKET: dvg-media
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      MEDIA_PUBLIC_BASE_URL: http://localhost:9000/dvg-media
      FRONTEND_REVALIDATE_URL: http://web:3000/api/revalidate
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:?set REVALIDATE_SECRET}
      IP_HASH_SALT: ${IP_HASH_SALT:?set IP_HASH_SALT}
      TRUST_PROXY: "1"
    ports: ["127.0.0.1:4000:4000"]

  web:
    build:
      context: ../FE-DVG
      args:
        API_INTERNAL_URL: http://api:4000
        NEXT_PUBLIC_SITE_URL: http://localhost:3000
        MEDIA_REMOTE_PATTERNS: http://localhost:9000/dvg-media
    depends_on: [api]
    environment:
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}
    ports: ["127.0.0.1:3000:3000"]

volumes:
  db-data:
  storage-data:
