# Production stack on one VPS: PostgreSQL, API, website and Caddy (HTTPS).
# Expected layout on the server:
#   /opt/dvg/BE-DVG   (this repository)
#   /opt/dvg/FE-DVG   (website repository)
# Run from /opt/dvg/BE-DVG/deploy:
#   docker compose --env-file .env.prod -f compose.prod.yaml up -d --build
# Media (images/videos) live in Cloudflare R2, not on this server.
name: dvg

services:
  db:
    # Same major version as the dev machine, so its dump restores here.
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dvg
      POSTGRES_USER: dvg
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql/<version>.
      - db-data:/var/lib/postgresql
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dvg -d dvg"]
      interval: 5s
      retries: 10
    # No published port: only the API (same Docker network) reaches it.

  # One-off jobs: migrations, seed, first admin.
  #   docker compose ... run --rm migrate
  #   docker compose ... run --rm migrate npm run db:seed
  migrate:
    build: { context: .., target: migrate }
    profiles: [tools]
    depends_on: { db: { condition: service_healthy } }
    env_file: .env.prod
    environment:
      DATABASE_URL: postgresql://dvg:${POSTGRES_PASSWORD}@db:5432/dvg?schema=public

  api:
    build: { context: .., target: runtime }
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    env_file: .env.prod
    environment:
      NODE_ENV: production
      PORT: "4000"
      DATABASE_URL: postgresql://dvg:${POSTGRES_PASSWORD}@db:5432/dvg?schema=public
      APP_ORIGINS: https://${DOMAIN}
      SITE_URL: https://${DOMAIN}
      COOKIE_SECURE: "true"
      STORAGE_DRIVER: s3
      FRONTEND_REVALIDATE_URL: http://web:3000/api/revalidate
      # Cloudflare → Caddy → website (rewrite) → API.
      TRUST_PROXY: "2"
    logging: { driver: json-file, options: { max-size: 20m, max-file: "5" } }

  web:
    build:
      context: ../../FE-DVG
      args:
        API_INTERNAL_URL: http://api:4000
        NEXT_PUBLIC_SITE_URL: https://${DOMAIN}
        MEDIA_REMOTE_PATTERNS: ${MEDIA_PUBLIC_BASE_URL:?set MEDIA_PUBLIC_BASE_URL}
        NEXT_PUBLIC_COMPANY_PHONE: ${NEXT_PUBLIC_COMPANY_PHONE:-}
    restart: unless-stopped
    depends_on: [api]
    environment:
      API_INTERNAL_URL: http://api:4000
      NEXT_PUBLIC_SITE_URL: https://${DOMAIN}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:?set REVALIDATE_SECRET}
    logging: { driver: json-file, options: { max-size: 20m, max-file: "5" } }

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on: [web]
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Cloudflare Origin Certificate (SSL/TLS › Origin Server).
      - ./certs:/etc/caddy/certs:ro
      - caddy-data:/data

volumes:
  db-data:
  caddy-data:
