name: BE-DVG CI

on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: dvg, POSTGRES_PASSWORD: dvg, POSTGRES_DB: dvg_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dvg" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://dvg:dvg@127.0.0.1:5432/dvg_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22.22", cache: npm }
      - run: npm install -g npm@11.21.1
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Migrations apply cleanly
        run: npx prisma migrate deploy
        env: { DATABASE_URL: "${{ env.TEST_DATABASE_URL }}" }
      - name: Schema matches migrations
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
        env: { DATABASE_URL: "${{ env.TEST_DATABASE_URL }}" }
      - run: npm run test:e2e
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  image:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build runtime image (not pushed)
        uses: docker/build-push-action@v6
        with: { context: ., target: runtime, push: false, tags: "be-dvg:ci" }
